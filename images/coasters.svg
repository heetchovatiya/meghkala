<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a stacked set of crochet coasters">
  <defs>
    <radialGradient id="coBg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#FBF6F2"/>
      <stop offset="100%" stop-color="#EFD9C9"/>
    </radialGradient>
    <linearGradient id="co1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6DDE4"/>
      <stop offset="100%" stop-color="#E9A9C2"/>
    </linearGradient>
    <linearGradient id="co2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6E3B4"/>
      <stop offset="100%" stop-color="#EACB84"/>
    </linearGradient>
    <linearGradient id="co3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7D4F0"/>
      <stop offset="100%" stop-color="#C6A0D9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#coBg)"/>
  <g>
    <ellipse cx="200" cy="260" rx="120" ry="34" fill="url(#co3)"/>
    <ellipse cx="200" cy="230" rx="120" ry="34" fill="url(#co2)"/>
    <ellipse cx="200" cy="200" rx="120" ry="34" fill="url(#co1)"/>
  </g>
  <g fill="none" stroke="#4A3B42" stroke-opacity="0.15" stroke-width="1.3">
    <ellipse cx="200" cy="200" rx="120" ry="34"/>
    <ellipse cx="200" cy="200" rx="90" ry="25"/>
    <ellipse cx="200" cy="200" rx="58" ry="16"/>
    <ellipse cx="200" cy="230" rx="120" ry="34"/>
    <ellipse cx="200" cy="260" rx="120" ry="34"/>
  </g>
  <g fill="#4A3B42" opacity="0.06">
    <ellipse cx="200" cy="200" rx="120" ry="8"/>
    <ellipse cx="200" cy="230" rx="120" ry="8"/>
  </g>
